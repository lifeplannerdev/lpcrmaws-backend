name: Deploy Backend to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: lpcrm
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/lpcrm/lpcrmaws-backend
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            source venv/bin/activate
            pip install -r requirements.txt
            python manage.py shell -c "from trainers.models import ExamResult, Attendance, Student, AcademicBatch; ExamResult.objects.all().delete(); Attendance.objects.all().delete(); Student.objects.all().delete(); AcademicBatch.objects.all().delete()"
            python manage.py migrate
            python manage.py collectstatic --noinput
            sudo systemctl daemon-reload
            sudo systemctl restart lpcrm-web
            sudo systemctl restart lpcrm-celery
            sudo systemctl restart lpcrm-beat
